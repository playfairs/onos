name: Build ONoS images

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
  release:
    types:
      - published

permissions:
  contents: write
  actions: write

jobs:
  build-images:
    name: Build ISO and IMG
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.create-dev-tag.outputs.tag || github.ref_name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Install image tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            busybox-static \
            cpio \
            dosfstools \
            grub-common \
            grub-efi-amd64-bin \
            grub-pc-bin \
            meson \
            mtools \
            ninja-build \
            qemu-utils \
            xorriso

      - name: Configure Meson
        env:
          ONOS_BUSYBOX: /usr/bin/busybox
        run: meson setup build

      - name: Select the runner Linux kernel
        run: |
          kernel=$(find /boot -maxdepth 1 -type f -name 'vmlinuz-*' | sort | tail -n 1)
          test -n "$kernel"
          readable_kernel="$RUNNER_TEMP/onos-vmlinuz"
          sudo install -m 0644 "$kernel" "$readable_kernel"
          echo "ONOS_KERNEL=$readable_kernel" >> "$GITHUB_ENV"
          echo "using $readable_kernel"

      - name: Run build checks
        env:
          ONOS_BUSYBOX: /usr/bin/busybox
        run: |
          meson compile -C build
          meson test -C build --print-errorlogs
          sh -n tools/make-initramfs.sh
          sh -n tools/make-iso.sh
          sh -n tools/make-img.sh
          sh -n tools/run-qemu.sh

      - name: Build initramfs and BIOS ISO
        env:
          ONOS_BUSYBOX: /usr/bin/busybox
        run: meson compile -C build onos-image

      - name: Build UEFI disk image
        env:
          ONOS_BUSYBOX: /usr/bin/busybox
        run: |
          tools/make-img.sh \
            build/image/onos-initramfs.cpio.gz \
            build/image/onos.img

      - name: Tag successful dev build
        id: create-dev-tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        run: |
          tag="dev-ci-${{ github.run_number }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Inspect generated images
        if: always()
        run: |
          echo "Generated image directory:"
          ls -lah build/image || true

      - name: Upload ISO and IMG artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: onos-images-${{ github.ref_name }}
          if-no-files-found: error
          path: |
            build/image/onos.iso
            build/image/onos.img

  release:
    name: Create ONoS release
    needs: build-images
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/dev')
    permissions:
      contents: write

    steps:
      - name: Download ONoS image artifacts
        uses: actions/download-artifact@v4
        with:
          name: onos-images-${{ github.ref_name }}
          path: release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build-images.outputs.release_tag }}
          prerelease: ${{ contains(needs.build-images.outputs.release_tag, '-') }}
          draft: true
          files: |
            release/onos.iso
            release/onos.img
          name: ONoS ${{ needs.build-images.outputs.release_tag }}
          fail_on_unmatched_files: true
