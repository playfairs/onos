[binaries]
c = 'x86_64-unknown-linux-musl-gcc'
ar = 'x86_64-unknown-linux-musl-ar'
strip = 'x86_64-unknown-linux-musl-strip'

[built-in options]
c_args = ['-static']
c_link_args = ['-static']

[properties]
needs_exe_wrapper = true

[host_machine]
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
